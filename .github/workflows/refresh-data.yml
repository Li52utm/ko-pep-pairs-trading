name: Data refresh

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC on weekdays, after the US close all year
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04   # pinned: a runner image upgrade must not change results silently
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # requirements.txt is pinned for Python 3.14
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Download, check, write snapshots, re-run research and pair hunt, update README
        run: python scripts/refresh_snapshots.py
      - name: Tests (offline)
        run: python -m pytest -q
      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          AS_OF=$(python -c "import pandas as pd; print(pd.read_csv('results/data_snapshot.csv', index_col=0, parse_dates=True).index[-1].date())")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results README.md
          git commit -m "Data refresh: as of ${AS_OF}"
          git push
