name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # requirements.txt is pinned for Python 3.14
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q   # offline: tests/conftest.py blocks every download
